<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>太湖麻将 · 微信小程序原型</title>
    <link rel="stylesheet" href="../shared/miniprogram.css" />

    <div class="studio-layout">

        <div class="canvas-footer">
          <span id="flow-position"></span
          ><span>可点击原型 · 场景与分数为设计样例</span>
        </div>
        <div id="review-controls"></div>
      </main>
      <aside id="annotations" aria-label="交互设计说明"></aside>
    </div>
    <script src="../blocks/ui.js"></script>
    <script src="../blocks/mobile.js"></script>
    <script src="../flows/miniprogram.js"></script>
